name: CI

on:
  push:
    # phase6/** included so the postgres-parity job (which needs CI's real
    # PostgreSQL service container -- the dev machine has none) verifies the
    # dual-backend work BEFORE it merges to main, not only after.
    branches: [main, "phase6/**"]
  pull_request:

# No real credentials are configured anywhere in this workflow -- every
# real-provider test suite stays skipped/refused/NOT-CONFIGURED as it does
# locally without them (see docs/OPERATIONS.md / docs/PUBLISHING.md). Live
# provider smoke checks are never run in CI; only the fake-provider E2E and
# the httpx.MockTransport-based YouTube contract E2E are exercised here.
permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg/ffprobe (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install espeak-ng (Ubuntu) -- Demo Mode's local TTS backend
        if: runner.os == 'Linux'
        run: sudo apt-get install -y espeak-ng

      - name: Install ffmpeg/ffprobe (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg -y
          ffmpeg -version
          ffprobe -version

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.27"
          python-version: ${{ matrix.python-version }}

      - name: Verify the lockfile matches pyproject.toml
        run: uv lock --check

      # --extra postgres: the driver only (psycopg) -- no PostgreSQL server in
      # this job; it lets the engine-construction unit tests run instead of
      # skipping (create_engine eagerly imports the DBAPI module). The real
      # server-backed tests live in the postgres-parity job below.
      # --extra google: the google-genai SDK only -- no credential and no
      # network call in this job. It lets the reference-image adapter's
      # contract tests run (they build requests out of the SDK's own
      # types) instead of skipping; every call is against an injected fake
      # client.
      - name: Install dependencies
        run: uv sync --extra dev --extra demo --extra postgres --extra google

      - name: Import check
        run: uv run python -c "import reel_harness; import reel_harness.api.app; import reel_harness.cli.main"

      - name: mypy
        run: uv run mypy reel_harness

      - name: ruff
        run: uv run ruff check reel_harness tests

      - name: pytest
        run: uv run pytest -v

      # A repo-internal credential-directory or OAuth-token-shaped literal
      # in tracked source is a defect regardless of which commit introduced
      # it -- checked on every CI run, not only when publisher code changes.
      # tests/ is excluded: redaction/forbidden-substring tests (e.g.
      # test_publish_journal.py) deliberately embed fake secret-SHAPED
      # values to prove rejection/redaction logic works -- that is the
      # opposite of a leak, not a thing to flag.
      - name: Secret/token grep
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nIE "AIza[0-9A-Za-z_-]{20,}|ya29\.[0-9A-Za-z_-]{10,}" -- '*.py' ':!tests'; then
            echo "::error::possible real API key/token literal found in tracked .py files"
            exit 1
          fi
          echo "no real-looking secret literals found"

      - name: Tracked artifact check
        shell: bash
        run: |
          set -euo pipefail
          if git status --porcelain | grep -E '^\?\? (jobs/|fable_projects/|.*\.db$)'; then
            echo "::error::a job artifact or database file would be tracked -- check .gitignore"
            exit 1
          fi
          echo "no stray job artifacts or database files"

  postgres-parity:
    name: postgres-parity (real PostgreSQL, dual-backend repository tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reel_harness
          POSTGRES_PASSWORD: reel_harness
          POSTGRES_DB: reel_harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client (pg_dump/pg_restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.27"
          python-version: "3.11"

      - name: Install dependencies (with the postgres extra)
        run: uv sync --extra dev --extra postgres

      # Real end-to-end verification against a live PostgreSQL server: schema
      # migration, db-status/db-verify, pg_dump/pg_restore backup/restore, and
      # a real two-thread concurrent lease-claim race -- the direct
      # verification the Phase 6A-1 architecture audit flagged as "reasoned
      # about, never verified" for SQLite-only CI. Every other job in this
      # workflow stays SQLite-only; this is the one place PostgreSQL is
      # actually exercised for real.
      - name: Repository-level tests against real PostgreSQL
        env:
          REEL_HARNESS_TEST_POSTGRES_URL: "postgresql+psycopg://reel_harness:reel_harness@localhost:5432/reel_harness_test"
        run: uv run pytest tests/integration/test_postgres_backend_parity.py -v

  production-smoke:
    name: production-smoke (Ubuntu, real ffmpeg, 1080x1920)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg/ffprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.27"
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev
      - name: production-smoke (real ffmpeg, full pipeline, no fake shortcuts)
        run: uv run pytest tests/e2e/test_production_smoke.py -v

  package-smoke:
    name: package-smoke (build wheel, install into a clean venv, run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.27"
          python-version: "3.11"

      - name: Build wheel and sdist
        run: uv build --out-dir dist

      - name: Install the built wheel into a clean venv (not the source tree)
        run: |
          uv venv /tmp/clean-venv
          uv pip install --python /tmp/clean-venv/bin/python dist/*.whl

      - name: Import + CLI entry point smoke (installed package only)
        working-directory: /tmp
        run: |
          /tmp/clean-venv/bin/python -c "
          import reel_harness, reel_harness.api.app, reel_harness.cli.main
          import reel_harness.providers.youtube_publisher, reel_harness.publisher.oauth_youtube
          import reel_harness.providers.tiktok_publisher, reel_harness.providers.instagram_publisher
          import reel_harness.ops.preflight, reel_harness.ops.supervisor, reel_harness.ops.release
          assert 'site-packages' in reel_harness.__file__, 'imported from source tree, not the installed wheel'
          print('installed-package imports OK:', reel_harness.__file__)
          "
          /tmp/clean-venv/bin/reel-harness --help

      - name: CLI --version (never requires an AppContext)
        working-directory: /tmp
        run: |
          version_output=$(/tmp/clean-venv/bin/reel-harness --version)
          echo "$version_output"
          echo "$version_output" | grep -qE '^reel-harness [0-9]+\.[0-9]+\.[0-9]+' || \
            (echo "::error::unexpected --version output: $version_output" && exit 1)

      - name: Fake-provider bootstrap + migration init (installed package only)
        working-directory: /tmp
        env:
          DATABASE_URL: "sqlite:////tmp/package-smoke.db"
          JOBS_DIR: "/tmp/package-smoke-jobs"
        run: |
          /tmp/clean-venv/bin/reel-harness doctor
          /tmp/clean-venv/bin/reel-harness channel-create --name smoke --niche cooking --language en

      - name: Release manifest validation (installed package, real dist/ artifacts)
        working-directory: /tmp
        env:
          DATABASE_URL: "sqlite:////tmp/package-smoke.db"
          JOBS_DIR: "/tmp/package-smoke-jobs"
        run: |
          mkdir -p /tmp/dist_copy
          cp $GITHUB_WORKSPACE/dist/*.whl $GITHUB_WORKSPACE/dist/*.tar.gz /tmp/dist_copy/
          WHEEL=$(ls /tmp/dist_copy/*.whl)
          SDIST=$(ls /tmp/dist_copy/*.tar.gz)
          /tmp/clean-venv/bin/reel-harness release-manifest --dest-path /tmp/release_manifest.json \
            --wheel-path "$WHEEL" --sdist-path "$SDIST"
          python3 -c "
          import json
          m = json.load(open('/tmp/release_manifest.json'))
          assert m['version'], 'missing version'
          assert m['schema_version'], 'missing schema_version'
          assert m['wheel_checksum_sha256'], 'wheel checksum not computed'
          assert m['sdist_checksum_sha256'], 'sdist checksum not computed'
          assert m['live_verification'] == 'not_run', 'CI has no live credentials -- must be not_run'
          assert m['known_limitations'], 'known_limitations must not be empty'
          print('release manifest OK:', m['version'], m['git_commit'])
          "

  release-check:
    name: release-check (fast checks -- full pytest/mypy/ruff already run in the test matrix)
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.27"
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync --extra dev
      # --skip-slow: the `test` job above already ran the full pytest/mypy/
      # ruff gate across the full OS/Python matrix -- rerunning it here
      # would be pure duplication. A human running `reel-harness
      # release-check` locally before tagging an RC should omit
      # --skip-slow for the real, full pre-tag gate.
      - name: release-check --skip-slow
        run: uv run reel-harness release-check --skip-slow --json
