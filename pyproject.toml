[project]
name = "reel-harness"
version = "0.1.0rc1"
description = "Local-first TikTok/Shorts short-form video generation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # HTTP client for the real (OpenAI-compatible) LLM/TTS provider adapters.
    "httpx>=0.27",
]

[project.scripts]
reel-harness = "reel_harness.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reel_harness"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) is idiomatic as an argument default, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["reel_harness"]
ignore_missing_imports = true
warn_unused_ignores = true
