[project]
name = "reel-harness"
version = "0.5.0rc1"
description = "Local-first TikTok/Shorts short-form video generation service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # HTTP client for the real (OpenAI-compatible) LLM/TTS provider adapters.
    "httpx>=0.27",
    # Web UI (reel_harness.web): server-rendered templates + Form(...) parsing.
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.scripts]
reel-harness = "reel_harness.cli.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
]
# Demo Mode only: offline/local text-to-speech (SAPI5 on Windows, espeak on
# Linux) for reel_harness.providers.demo_tts -- no network call, no API key.
# Never required for the fake/real pipelines; see reel_harness/providers/demo_tts.py.
demo = [
    "pyttsx3>=2.90",
]
# Browser E2E for the web UI (tests/e2e/test_web_ui_playwright.py) only --
# requires a separate `playwright install chromium` to download a real
# browser; never required for the fake/demo/real pipelines or the rest of
# the test suite.
e2e-browser = [
    "playwright>=1.40",
]
# PostgreSQL backend only (see reel_harness/db/schema.py::create_engine_from_url).
# SQLite stays the zero-config default; this is never required for the
# local/Demo Mode experience. psycopg (v3), not psycopg2 (legacy,
# maintenance-only) or asyncpg (async-only -- this codebase is fully sync
# SQLAlchemy) -- [binary] ships prebuilt wheels for Windows and Linux, no
# C compiler or pg_config needed on the dev machine.
postgres = [
    "psycopg[binary]>=3.1",
]
# Fable reference-image generation against Google's real image models
# (reel_harness/providers/google_reference_image.py) and, later, Veo video
# generation -- one SDK and one credential for both, which is why this
# vendor was chosen (see docs/STATUS.md's provider research). NEVER a hard
# dependency: the fake and demo tiers run the entire Fable pipeline
# offline, and the adapter fails with a clear install instruction rather
# than an ImportError traceback when the extra is absent.
google = [
    "google-genai>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reel_harness"]
# Web UI templates/static assets (see reel_harness/web/) -- there are no
# other non-.py files under reel_harness/ today, so hatchling's `packages`
# selection alone does not sweep these in; verified by inspecting the built
# wheel's file listing (see docs/OPERATIONS.md's web UI packaging section).
artifacts = [
    "reel_harness/web/templates/**/*.html",
    "reel_harness/web/static/**/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 115
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends(...) is idiomatic as an argument default, not a bug.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
packages = ["reel_harness"]
ignore_missing_imports = true
warn_unused_ignores = true
